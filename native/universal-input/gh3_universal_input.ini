; GH3 Universal Input - configuration
; Place this file next to GH3.exe together with xinput1_3.dll.

[General]
; 0 = pass everything through untouched (as if the DLL were not installed)
Enabled=1
; Writes gh3_universal_input.log next to GH3.exe (connections and detected device types)
Log=1
; Hide controllers that have a [Device.*] mapping from GH3's DirectInput list, so they only
; show up once (as a guitar) instead of also appearing as a gamepad.
HideFromDirectInput=1

; Per-controller-slot mode. Slot1 is the first controller Windows assigns, and so on.
;   Auto    - guitars of any kind are presented to GH3 as Guitar Hero guitars,
;             regular gamepads are left untouched (default)
;   Guitar  - always present this slot as a guitar
;   Gamepad - always present this slot as a regular gamepad
; The in-game "P1 / P2 Input Mode" modifier overrides these whenever it is not set to Auto.
[Slot1]
Mode=Auto
[Slot2]
Mode=Auto
[Slot3]
Mode=Auto
[Slot4]
Mode=Auto

; Non-XInput guitars (HID / PS3 / Wii adapters / Raspberry Pi builds) need a mapping.
; Run gh3-guitar-setup.exe from the game folder to create one; it adds a section like:
;
; [Device.1209:2882]
; Name=Revival Kit v1 - GH Guitar (Default)
; Green=button 1
; StrumUp=hat up
; Whammy=axis 30 0 255      (usage, value at rest, value fully pushed)
; Tilt=axis 33 188 230      (or "button <n>" for a tilt switch)
;
; Mapped guitars take the first free controller slot and appear to GH3 as a guitar.
