; GH3 Universal Input - configuration
; Place this file next to GH3.exe together with xinput1_3.dll.

[General]
; 0 = pass everything through untouched (as if the DLL were not installed)
Enabled=1
; Writes gh3_universal_input.log next to GH3.exe (connections and detected device types)
Log=1

; Per-controller-slot mode. Slot1 is the first controller Windows assigns, and so on.
;   Auto    - guitars of any kind are presented to GH3 as Guitar Hero guitars,
;             regular gamepads are left untouched (default)
;   Guitar  - always present this slot as a guitar
;   Gamepad - always present this slot as a regular gamepad
[Slot1]
Mode=Auto
[Slot2]
Mode=Auto
[Slot3]
Mode=Auto
[Slot4]
Mode=Auto
